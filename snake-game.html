<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Змейка</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: white;
        background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
            url("https://images.unsplash.com/photo-1500534623283-312aade485b7") center/cover fixed;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px;
    }

    a.back-link {
        color: #aad4ff;
        text-decoration: none;
        font-size: 14px;
        align-self: flex-start;
        margin-bottom: 10px;
    }

    h1 { margin-top: 0; }

    #score {
        font-size: 18px;
        margin-bottom: 10px;
    }

    canvas {
        background: rgba(0,0,0,0.4);
        border-radius: 12px;
        border: 2px solid rgba(255,255,255,0.3);
    }

    #gameMessage {
        margin-top: 15px;
        font-size: 16px;
        min-height: 24px;
        color: #ffe58a;
    }

    button {
        padding: 10px 18px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        background: rgba(255,255,255,0.85);
    }
</style>
</head>
<body>

<a href="index.html" class="back-link">← Назад в портфолио</a>
<h1>🐍 Змейка</h1>
<div id="score">Счёт: 0 | Рекорд: 0</div>

<canvas id="gameCanvas" width="400" height="400"></canvas>

<p id="gameMessage">Стрелки или WASD, чтобы двигаться</p>
<button onclick="restartGame()">🔄 Начать заново</button>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const gridSize = 20; // размер одной клетки в пикселях
    const tileCount = canvas.width / gridSize; // сколько клеток помещается (400 / 20 = 20)

    let snake = [{ x: 10, y: 10 }];
    let direction = { x: 0, y: 0 };
    let food = { x: 5, y: 5 };
    let score = 0;
    let bestScore = Number(localStorage.getItem("snakeBestScore")) || 0;
    let gameOver = false;

    document.getElementById("score").textContent = "Счёт: 0 | Рекорд: " + bestScore;

    function placeFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
    }

    function update() {
        if (gameOver) return;

        // не двигаемся, пока игрок не нажал первую стрелку
        if (direction.x === 0 && direction.y === 0) return;

        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

        // столкновение со стеной
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            endGame();
            return;
        }

        // столкновение с самой собой
        for (let i = 0; i < snake.length; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) {
                endGame();
                return;
            }
        }

        snake.unshift(head); // добавляем новую голову в начало массива

        if (head.x === food.x && head.y === food.y) {
            score++;
            document.getElementById("score").textContent = "Счёт: " + score + " | Рекорд: " + bestScore;
            placeFood();
        } else {
            snake.pop(); // убираем последний хвост, если еда не съедена
        }
    }

    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#2ecc71";
        snake.forEach(segment => {
            ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
        });

        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
    }

    function gameLoop() {
        update();
        draw();
    }

    function endGame() {
        gameOver = true;
        document.getElementById("gameMessage").textContent = "💀 Игра окончена! Счёт: " + score;

        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem("snakeBestScore", bestScore);
        }
        document.getElementById("score").textContent = "Счёт: " + score + " | Рекорд: " + bestScore;
    }

    function restartGame() {
        snake = [{ x: 10, y: 10 }];
        direction = { x: 0, y: 0 };
        score = 0;
        gameOver = false;
        placeFood();
        document.getElementById("gameMessage").textContent = "Используй стрелки на клавиатуре, чтобы двигаться";
        document.getElementById("score").textContent = "Счёт: 0 | Рекорд: " + bestScore;
    }

    document.addEventListener("keydown", function (e) {
        const key = e.key.toLowerCase();

        if ((key === "w" || key === "arrowup") && direction.y === 0) direction = { x: 0, y: -1 };
        if ((key === "s" || key === "arrowdown") && direction.y === 0) direction = { x: 0, y: 1 };
        if ((key === "a" || key === "arrowleft") && direction.x === 0) direction = { x: -1, y: 0 };
        if ((key === "d" || key === "arrowright") && direction.x === 0) direction = { x: 1, y: 0 };
    });

    setInterval(gameLoop, 120);
</script>

</body>
</html>
