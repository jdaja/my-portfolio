<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Случайные цитаты</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        color: white;
        background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
            url("https://images.unsplash.com/photo-1500534623283-312aade485b7") center/cover fixed;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
    }

    .container {
        width: 100%;
        max-width: 550px;
        padding: 35px;
        border-radius: 20px;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(12px);
        text-align: center;
    }

    a.back-link {
        color: #aad4ff;
        text-decoration: none;
        font-size: 14px;
        display: block;
        text-align: left;
        margin-bottom: 15px;
    }

    h1 { margin-top: 0; }

    #quoteText {
        font-size: 20px;
        font-style: italic;
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #quoteAuthor {
        color: #ffe58a;
        margin-bottom: 25px;
    }

    button {
        padding: 12px 22px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        background: rgba(255,255,255,0.85);
    }

    button:hover { transform: scale(1.05); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Назад в портфолио</a>
    <h1>💬 Случайная цитата</h1>

    <p id="quoteText">Нажми кнопку, чтобы получить цитату</p>
    <p id="quoteAuthor"></p>

    <button id="quoteBtn" onclick="getQuote()">🔄 Новая цитата</button>
</div>

<script>
    async function getQuote() {
        const button = document.getElementById("quoteBtn");
        const quoteText = document.getElementById("quoteText");
        const quoteAuthor = document.getElementById("quoteAuthor");

        button.disabled = true;
        quoteText.textContent = "Загружаем цитату...";
        quoteAuthor.textContent = "";

        try {
            const response = await fetch("https://dummyjson.com/quotes/random");
            const data = await response.json();

            quoteText.textContent = "«" + data.quote + "»";
            quoteAuthor.textContent = "— " + data.author;
        } catch (error) {
            quoteText.textContent = "Не удалось загрузить цитату. Попробуй ещё раз.";
        }

        button.disabled = false;
    }
</script>

</body>
</html>
