<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Случайные цитаты</title>
<style>
    :root {
        --bg: #f6f6f8; --surface: #ffffff; --surface-2: #f0f0f3;
        --text: #17171a; --muted: #66666e; --border: #e4e4e8;
        --accent: #6c5ce7; --accent-soft: rgba(108,92,231,.12);
        --good: #1f9d55; --bad: #d64545; --warn: #e8a13c;
        --radius: 14px;
        --shadow: 0 1px 2px rgba(20,20,25,.05), 0 8px 24px rgba(20,20,25,.07);
    }
    body.dark {
        --bg: #121215; --surface: #1b1b1f; --surface-2: #242429;
        --text: #f1f1f3; --muted: #a2a2ac; --border: #2d2d33;
        --accent: #9a8cff; --accent-soft: rgba(154,140,255,.16);
        --good: #3ecf7a; --bad: #ff6b6b; --warn: #f5b14c;
        --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; min-height: 100vh; padding: 24px 16px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg); color: var(--text); line-height: 1.6;
        transition: background .3s, color .3s;
    }
    button, input, select { font: inherit; }
    .wrap { max-width: 640px; margin: 0 auto; }
    .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;
    }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .back { color: var(--muted); text-decoration: none; font-size: 14px; }
    .back:hover { color: var(--text); }
    #themeBtn {
        border: 1px solid var(--border); background: var(--surface); color: var(--text);
        border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13px;
    }
    #themeBtn:hover { background: var(--surface-2); }
    h1 { font-size: 22px; margin: 0 0 12px; }
    .btn {
        padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer;
        font-size: 15px; font-weight: 600; background: var(--accent); color: #fff;
        transition: filter .15s, transform .15s;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(.97); }
    .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--border); filter: none; }

    .quote-box {
        background: var(--surface-2); border-radius: 14px; padding: 28px 24px;
        min-height: 190px; display: flex; flex-direction: column; justify-content: center;
        text-align: center; gap: 12px; margin-bottom: 16px;
    }
    #quoteText { font-size: 19px; font-style: italic; line-height: 1.55; margin: 0; transition: opacity .25s; }
    #quoteAuthor { color: var(--accent); font-weight: 600; margin: 0; font-size: 15px; }
    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 14px; }
</style>
<base target="_blank">
</head>
<body>
<div class="wrap" style="max-width: 560px;">
  <div class="topbar">
    <a class="back" href="index.html">← Назад в портфолио</a>
    <button id="themeBtn" onclick="toggleTheme()">🌙 Тёмная</button>
  </div>
  <div class="card">
    <h1>💬 Случайная цитата</h1>
    <div class="quote-box">
        <p id="quoteText">Нажми кнопку, чтобы получить цитату</p>
        <p id="quoteAuthor"></p>
    </div>
    <div class="row">
        <button class="btn" id="quoteBtn" onclick="getQuote()">🔄 Новая цитата</button>
        <button class="btn btn-ghost" onclick="copyQuote()">📋 Копировать</button>
    </div>
    <p class="note">Цитаты загружаются из открытого API и переводятся на русский. Если сеть недоступна — покажу цитату из своей коллекции.</p>
  </div>
</div>
<script>

    function toggleTheme() {
        document.body.classList.toggle("dark");
        localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
        updateThemeBtn();
    }
    function updateThemeBtn() {
        document.getElementById("themeBtn").textContent =
            document.body.classList.contains("dark") ? "☀️ Светлая" : "🌙 Тёмная";
    }
    if (localStorage.getItem("theme") === "dark") document.body.classList.add("dark");
    updateThemeBtn();

/* Запасная коллекция на случай проблем с сетью или переводом */
const fallbackQuotes = [
    { text: "Программирование — это разбиение большой неподъёмной задачи на маленькие вполне подъёмные.", author: "Русская пословица, джуновская" },
    { text: "Сначала решите задачу. Затем напишите код.", author: "Джон Джонсон" },
    { text: "Код как юмор: когда его приходится объяснять, он неудачен.", author: "Кори Хаус" },
    { text: "Лучший способ изучить программирование — писать программы.", author: "Денис Ритчи" },
    { text: "Ошибки — это не провал. Это проверка границ твоих знаний.", author: "Автор неизвестен" },
    { text: "Всегда пиши код так, будто тот, кто будет его поддерживать — склонный к насилию психопат, знающий твой адрес.", author: "Джон Вудс" },
    { text: "Простота — душа эффективности.", author: "Остин Фриман" },
    { text: "Не бойся совершенства: тебе его всё равно не достичь.", author: "Сальвадор Дали" }
];

async function translateToRussian(text) {
    const params = new URLSearchParams({ q: text, langpair: "en|ru" });
    const controller = new AbortController();
    const timeout = setTimeout(function () { controller.abort(); }, 6000);
    try {
        const response = await fetch("https://api.mymemory.translated.net/get?" + params, { signal: controller.signal });
        const data = await response.json();
        const translated = data.responseData && data.responseData.translatedText;
        if (translated) return translated;
    } finally {
        clearTimeout(timeout);
    }
    throw new Error("no translation");
}

function setQuote(text, author) {
    document.getElementById("quoteText").textContent = "«" + text + "»";
    document.getElementById("quoteAuthor").textContent = "— " + author;
}

async function getQuote() {
    const button = document.getElementById("quoteBtn");
    const textEl = document.getElementById("quoteText");
    const authorEl = document.getElementById("quoteAuthor");

    button.disabled = true;
    textEl.style.opacity = 0.4;
    button.innerHTML = '<span class="spin">🔄</span> Загружаем...';

    try {
        const controller = new AbortController();
        const timeout = setTimeout(function () { controller.abort(); }, 6000);
        let data;
        try {
            const response = await fetch("https://dummyjson.com/quotes/random", { signal: controller.signal });
            data = await response.json();
        } finally {
            clearTimeout(timeout);
        }

        let quoteText = data.quote;
        try {
            quoteText = await translateToRussian(data.quote);
        } catch (e) { /* оставляем английский оригинал */ }

        setQuote(quoteText, data.author);
    } catch (error) {
        // сеть недоступна — показываем цитату из своей коллекции
        const q = fallbackQuotes[Math.floor(Math.random() * fallbackQuotes.length)];
        setQuote(q.text, q.author);
    }

    textEl.style.opacity = 1;
    button.disabled = false;
    button.innerHTML = "🔄 Новая цитата";
}

function copyQuote() {
    const text = document.getElementById("quoteText").textContent;
    const author = document.getElementById("quoteAuthor").textContent;
    if (!text || text.indexOf("Нажми") === 0) return;
    navigator.clipboard.writeText(text + " " + author).then(function () {
        const btn = event.target;
        const old = btn.textContent;
        btn.textContent = "✓ Скопировано";
        setTimeout(function () { btn.textContent = old; }, 1500);
    });
}

getQuote();
</script>
</body>
</html>
